function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeInitial(){return {stage:-1,student:'',klass:'',startedAt:0,completed:{},quiz:{},builder:{theme:'',title:'',subtitle:'',color:'',layout:'',sections:{features:false,steps:false,contact:false}},seen:{phone:false,code:false},device:'desktop',view:'preview',publishOrder:shuffle([0,1,2,3,4]),publishChecked:false}}
function load(){try{const raw=localStorage.getItem(STORAGE);if(!raw)return makeInitial();const x=JSON.parse(raw);if(!x||typeof x.stage!=='number'||!x.builder||!x.completed)return makeInitial();return x}catch(_){return makeInitial()}}
let S=load();const root=document.getElementById('content');let toastTimer=null;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(S))}catch(_){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function score(){return Object.keys(S.completed).reduce((n,k)=>n+(Number(S.completed[k])||0),0)}
function doneCount(){return STAGES.filter(x=>Object.prototype.hasOwnProperty.call(S.completed,x.id)).length}
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function scrollTopMain(){try{window.scrollTo({top:0,behavior:'smooth'})}catch(_){window.scrollTo(0,0)}}
function tick(){let s=S.startedAt?Math.max(0,Math.floor((Date.now()-S.startedAt)/1000)):0;document.getElementById('time-pill').textContent='⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function syncHeader(){const completed=doneCount();document.getElementById('part-pill').textContent=completed+' / 6 МІСІЙ';document.getElementById('score-pill').textContent='★ '+score()+' / 120';document.getElementById('progress-fill').style.width=(completed/6*100)+'%';tick()}
function chooseQuestions(id){
 if(!S.quiz[id]){
  const order=shuffle(Q[id].map((_,i)=>i)).slice(0,5);
  // У п'яти запитаннях кожна літера A–D є правильною хоча б один раз;
  // п'ята позиція додаткова, а порядок щоразу новий.
  const targetPositions=shuffle([0,1,2,3,Math.floor(Math.random()*4)]);
  const options=order.map((qi,pos)=>{
   const correct=Q[id][qi].a;
   const placement=shuffle(Q[id][qi].o.map((_,i)=>i).filter(i=>i!==correct));
   placement.splice(targetPositions[pos],0,correct);
   return placement;
  });
  S.quiz[id]={order,pos:0,picked:{},options};
  save();
 }
 const quiz=S.quiz[id];
 // Сумісність зі збереженим проходженням попередньої версії:
 // уже зроблені відповіді залишаються прив'язаними до початкових індексів.
 if(!Array.isArray(quiz.options)||quiz.options.length!==quiz.order.length){
  quiz.options=quiz.order.map((qi,pos)=>{
   const indices=Q[id][qi].o.map((_,i)=>i);
   return quiz.picked[String(pos)]!==undefined?indices:shuffle(indices);
  });
  save();
 }
 return quiz;
}
function render(){syncHeader();if(S.stage===-1){root.innerHTML=renderIntro()}else if(S.stage>=0&&S.stage<6){const item=STAGES[S.stage];if(item.type==='quiz')root.innerHTML=renderQuiz(item);if(item.type==='builder')root.innerHTML=renderBuilder();if(item.type==='order')root.innerHTML=renderPublish()}else{root.innerHTML=renderFinish()}if(S.stage===3&&!('studio' in S.completed))refreshBuilderFragments();save()}

ляція публікації.</li><li><b>37–40 хв.</b> Учні копіюють текст звіту в чат/форму або надсилають скріншот. За бажанням завантажують створену сторінку.</li></ol><p class="tiny muted">Порада: файл HTML можна розмістити на GitHub Pages. Для учнів достатньо одного посилання. Це локальна навчальна гра: вона не передає результати вчителю автоматично.</p></details>`}

root.addEventListener('input',updateInput);root.addEventListener('change',updateInput);
root.addEventListener('click',async function(e){const btn=e.target.closest('button[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action;
if(action==='start'){const name=document.getElementById('student-name'),klass=document.getElementById('student-class');if(name)S.student=name.value.trim();if(klass)S.klass=klass.value.trim();if(!S.startedAt)S.startedAt=Date.now();S.stage=0;render();scrollTopMain();return}
if(action==='answer'){const item=STAGES[S.stage],quiz=chooseQuestions(item.id);if(quiz.picked[String(quiz.pos)]!==undefined)return;quiz.picked[String(quiz.pos)]=Number(btn.dataset.option);render();return}
if(action==='next-question'){const item=STAGES[S.stage],quiz=chooseQuestions(item.id);if(quiz.picked[String(quiz.pos)]===undefined)return;if(quiz.pos<4)quiz.pos++;else{S.completed[item.id]=quiz.order.reduce((n,qi,idx)=>n+(quiz.picked[String(idx)]===Q[item.id][qi].a?4:0),0)}render();scrollTopMain();return}
if(action==='next-stage'){if(S.stage<5)S.stage++;else S.stage=6;render();scrollTopMain();return}
if(action==='set-theme'){S.builder.theme=btn.dataset.value;render();return}
if(action==='set-color'){S.builder.color=btn.dataset.value;render();return}
if(action==='set-layout'){S.builder.layout=btn.dataset.value;render();return}
if(action==='device'){S.device=btn.dataset.value;if(S.device==='phone')S.seen.phone=true;render();return}
if(action==='view'){S.view=btn.dataset.value;if(S.view==='code')S.seen.code=true;render();return}
if(action==='check-builder'){const checks=builderChecks();const earned=checks.filter(x=>x.ok).length*4;if(earned<20){notify('Можна заробити ще '+(20-earned)+' балів. Перевір критерії ліворуч.');const el=document.getElementById('builder-checks');if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'})}else{S.completed.studio=20;render();scrollTopMain()}return}
if(action==='finish-builder'){const earned=builderChecks().filter(x=>x.ok).length*4;if(window.confirm('Завершити майстерню з '+earned+' із 20 балів? Після цього змінити проєкт у цій спробі буде не можна.')){S.completed.studio=earned;render();scrollTopMain()}return}
if(action==='move'){const i=Number(btn.dataset.index),j=i+Number(btn.dataset.dir);if(i<0||i>=5||j<0||j>=5)return;[S.publishOrder[i],S.publishOrder[j]]=[S.publishOrder[j],S.publishOrder[i]];render();return}
if(action==='shuffle-publish'){S.publishOrder=shuffle([0,1,2,3,4]);render();return}
if(action==='check-publish'){S.completed.publish=S.publishOrder.reduce((n,v,i)=>n+(v===i?4:0),0);render();scrollTopMain();return}
if(action==='download-site'){const name=filenameSafe(S.builder.title||'mii-sait');download(name+'.html',siteParts().html,'text/html;charset=utf-8');notify('Файл HTML створено. Відкрий його у браузері.');return}
if(action==='download-report'){download('WEB_QUEST_11_zvit.txt',report(),'text/plain;charset=utf-8');notify('Текстовий звіт підготовлено.');return}
if(action==='copy-report'){const text=report();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);notify('Звіт скопійовано!');return}}catch(_){}const area=document.getElementById('result-report');if(area){area.focus();area.select();try{if(document.execCommand('copy')){notify('Звіт скопійовано!');return}}catch(_){}}notify('Виділений звіт можна скопіювати вручну.');return}
if(action==='reset'){if(window.confirm('Почати нову спробу? Усі результати поточного проходження буде втрачено.')){S=makeInitial();save();render();scrollTopMain()}return}
});
window.addEventListener('pageshow',()=>{render()});
setInterval(tick,1000);
render();
})();
</script>
</body>
</html>
